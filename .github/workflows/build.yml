name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Stemquill and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import stemquill; print(stemquill.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match stemquill.__version__ ${{ steps.ver.outputs.version }}"
            exit 1
          fi

      - name: Build app
        run: pyinstaller --noconfirm packaging/stemquill.spec

      - name: Smoke test - convert a drum loop
        shell: pwsh
        run: |
          python packaging/make_test_stem.py test-drums.wav
          $p = Start-Process -FilePath "dist\Stemquill\Stemquill.exe" `
               -ArgumentList '"test-drums.wav" --type drums --bpm 120 --out smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Stemquill exited with $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "smoke\test-drums - drums.mid")) { Write-Error "No MIDI file was written"; exit 1 }
          Get-ChildItem smoke

      - name: Smoke test - window opens and stays open
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Stemquill\Stemquill.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "The window closed by itself (exit code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          Write-Output "Window opened and stayed open"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\Stemquill -DestinationPath "dist\installer\Stemquill-${{ steps.ver.outputs.version }}-windows-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Stemquill-${{ steps.ver.outputs.version }}-windows
          path: dist/installer/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Stemquill ${{ steps.ver.outputs.version }}
          files: dist/installer/*
          generate_release_notes: true
