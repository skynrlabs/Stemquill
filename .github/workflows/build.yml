name: Build Windows app

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Stemquill and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import stemquill; print(stemquill.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: github.event_name == 'release'
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match stemquill.__version__ ${{ steps.ver.outputs.version }}"
            exit 1
          fi

      - name: Build app
        run: pyinstaller --noconfirm packaging/stemquill.spec

      - name: Smoke test - convert a drum loop
        shell: pwsh
        run: |
          python packaging/make_test_stem.py test-drums.wav
          $p = Start-Process -FilePath "dist\Stemquill\Stemquill.exe" `
               -ArgumentList '"test-drums.wav" --type drums --bpm 120 --out smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Stemquill exited with $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "smoke\test-drums - drums.mid")) { Write-Error "No MIDI file was written"; exit 1 }
          Get-ChildItem smoke

      - name: Smoke test - window opens and stays open
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Stemquill\Stemquill.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "The window closed by itself (exit code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          Write-Output "Window opened and stayed open"

      - name: Build chord-detection add-on
        shell: pwsh
        run: |
          pip install --no-deps --target dist\addons\chords -r packaging\chords-addon.txt
          # trim parts basic-pitch never uses
          Remove-Item -Recurse -Force dist\addons\chords\bin -ErrorAction SilentlyContinue
          Remove-Item -Force dist\addons\chords\pretty_midi\*.sf2
          Remove-Item -Recurse -Force dist\addons\chords\onnxruntime\transformers, dist\addons\chords\onnxruntime\quantization, dist\addons\chords\onnxruntime\tools -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist\addons\chords\basic_pitch\saved_models\icassp_2022\nmp -ErrorAction SilentlyContinue
          Remove-Item -Force dist\addons\chords\basic_pitch\saved_models\icassp_2022\*.tflite -ErrorAction SilentlyContinue
          $size = (Get-ChildItem dist\addons\chords -Recurse -File | Measure-Object Length -Sum).Sum
          "::notice title=Chord add-on::$([math]::Round($size / 1MB, 0)) MB installed"

      - name: Smoke test - chords with and without the add-on
        shell: pwsh
        run: |
          python packaging/make_test_stem.py test-chords.wav chords
          $env:STEMQUILL_LOG = "$PWD\builtin.log"
          $p = Start-Process -FilePath "dist\Stemquill\Stemquill.exe" `
               -ArgumentList '"test-chords.wav" --type melodic --bpm 120 --out smoke-chords' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Built-in chord mode failed"; exit 1 }
          if (-not (Select-String -Path builtin.log -Pattern "built-in polyphonic" -Quiet)) { Get-Content builtin.log; Write-Error "Expected built-in mode"; exit 1 }
          Copy-Item -Recurse dist\addons dist\Stemquill\addons
          $env:STEMQUILL_LOG = "$PWD\addon.log"
          $p = Start-Process -FilePath "dist\Stemquill\Stemquill.exe" `
               -ArgumentList '"test-chords.wav" --type melodic --bpm 120 --out smoke-chords' -Wait -PassThru
          Remove-Item -Recurse -Force dist\Stemquill\addons
          Get-Content addon.log
          if ($p.ExitCode -ne 0) { Write-Error "Chord add-on run failed"; exit 1 }
          if (-not (Select-String -Path addon.log -Pattern "\(basic-pitch\)" -Quiet)) { Write-Error "basic-pitch add-on was not used"; exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem dist\installer | ForEach-Object {
            "::notice title=$($_.Name)::$([math]::Round($_.Length / 1MB, 1)) MB"
          }
          $app = (Get-ChildItem dist\Stemquill -Recurse -File | Measure-Object Length -Sum).Sum
          "::notice title=Installed size::$([math]::Round($app / 1MB, 0)) MB"
          Get-ChildItem dist\Stemquill\_internal | ForEach-Object {
            $size = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum } else { $_.Length }
            [pscustomobject]@{ Name = $_.Name; MB = [math]::Round($size / 1MB, 1) }
          } | Sort-Object MB -Descending | Select-Object -First 12 | Format-Table -AutoSize

      - uses: actions/upload-artifact@v5
        with:
          name: Stemquill-${{ steps.ver.outputs.version }}-windows
          path: dist/installer/*.exe

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
